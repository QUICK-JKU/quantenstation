<body>

<header class="q-topbar">
  <div class="q-topbar-inner">
    <a class="q-back" href="index.html" data-q-back aria-label="Zurück zum Quiz-Pool">←</a>
    <div class="q-topbar-title" data-quiz-bar-title>Quiz</div>
    <div class="q-topbar-badge">🔒 Code</div>
    <a class="q-lang" href="../en/quiz/quiz.html" hreflang="en" lang="en" translate="no" data-q-lang="en" aria-label="English version">EN</a>
  </div>
</header>

<main class="q-main">
  <div class="q-glow"></div>

  <div class="q-wrap q-center">
    <div class="q-eyebrow" data-quiz-eyebrow>Quiz</div>
    <h1 class="q-h1" data-quiz-title>Quiz</h1>
    <p class="q-lead" style="max-width:420px;margin-left:auto;margin-right:auto;font-size:15px;" data-quiz-sub></p>
  </div>

  <div class="q-wrap q-mt" data-quiz-run>
    <div class="quiz-progress">
      <div class="q-meter"><div class="q-meter-fill" data-quiz-meter></div></div>
      <span class="quiz-step" data-quiz-step></span>
    </div>

    <div class="q-mt-sm" data-quiz-stage tabindex="-1"></div>
  </div>

  <div class="q-wrap">
    <div class="q-success" data-quiz-success hidden>
      <div class="q-success-label" data-quiz-success-label>GELÖST ✓</div>
      <div class="q-code" data-q-code></div>
      <div class="q-body t-green" style="font-weight:600;">🔓 Das ist dein Code.</div>
      <button class="q-btn" type="button" data-quiz-again>↺ Noch einmal</button>
      <a class="q-btn q-btn-green" href="index.html">Weiteres Quiz wählen →</a>
    </div>
  </div>

  <noscript>
    <div class="q-wrap q-mt">
      <div class="q-note">
        <div class="q-note-title">JavaScript ist aus</div>
        <div class="q-body">
          Ohne JavaScript lässt sich das Quiz nicht spielen. Die Infoseiten der
          Stationen funktionieren aber weiterhin.
        </div>
      </div>
    </div>
  </noscript>

  <div class="q-wrap q-mt">
    <p class="q-fine q-center" style="max-width:340px;margin-left:auto;margin-right:auto;">
      Die Antwortmöglichkeiten werden bei jedem Start neu gemischt.
      Fortschritt und Code bleiben auf diesem Gerät gespeichert.
    </p>
  </div>

</main>

<nav class="q-bottombar" aria-label="Stationen">
  <div class="q-bottombar-inner">
    <a class="q-navitem" href="../index.html"><span class="ico" aria-hidden="true">🏠</span>Start</a>

    <a class="q-navitem" href="../stations/5-ama/"><span class="ico" aria-hidden="true">💬</span>FAQ</a>
  </div>
</nav>
